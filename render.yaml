# Blueprint de despliegue en Render (render.com) — despliega backend y frontend
# con un solo "New Blueprint" apuntando a este repositorio.
# Ver docs/DEPLOY.md para el paso a paso.
#
# Base de datos: la Postgres gratuita de Render expira a los 30 días, así que
# mientras el proyecto está en fase piloto (sin presupuesto aprobado todavía)
# se usa una base externa gratuita en Neon (neon.tech), que no caduca por
# tiempo. Por eso ya no hay bloque "databases:" aquí — DATABASE_URL se
# configura a mano en el dashboard de Render (ver más abajo, "sync: false")
# para no dejar la contraseña de la base en el repositorio.

services:
  - type: web
    name: ecsa-sst-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev es necesario: con NODE_ENV=production definido más abajo,
    # `npm install` por defecto omite devDependencies (typescript, @types/*,
    # prisma CLI), que sí se necesitan para compilar en este paso de build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run release && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # sync: false = Render no la trae del Blueprint ni la borra en un
        # redeploy; se pega el connection string de Neon a mano en el
        # dashboard (Environment del servicio) y queda guardada ahí.
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGIN
        value: "https://ecsa-sst-frontend.onrender.com"

  - type: web
    name: ecsa-sst-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://ecsa-sst-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
